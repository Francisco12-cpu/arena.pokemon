      /* tela de carregamento: aparece antes de qualquer script. O ícone do jogo no meio de raios girando,

      @font-face { font-family: Bangers; src: url(./fonts/Bangers.ttf); font-display: swap; }
      #carregando { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: min(2.4vh, 18px); overflow: hidden;
        background: #14163a; color: #fff; font-family: "Segoe UI", system-ui, sans-serif; transition: opacity 0.45s; }
      #carregando::before { content: ''; position: absolute; left: 50%; top: 42%; width: 260vmax; height: 260vmax; margin: -130vmax; z-index: -2;
        background: repeating-conic-gradient(from 0deg, #2b2f86 0deg 10deg, #1a1d5c 10deg 20deg); animation: raios 24s linear infinite; }
      #carregando::after { content: ''; position: absolute; inset: 0; z-index: -1; background: radial-gradient(circle at 50% 42%, rgba(255, 220, 120, 0.28), transparent 38%), radial-gradient(ellipse at 50% 50%, transparent 40%, rgba(5, 6, 20, 0.85)); }
      @keyframes raios { to { transform: rotate(360deg); } }
      #carregando .logo { width: min(34vh, 230px); height: min(34vh, 230px); border-radius: 26%; background: url(./icons/icone-512.png) center / cover; box-shadow: 0 10px 0 rgba(0, 0, 0, 0.35), 0 0 60px rgba(255, 200, 60, 0.35);
        animation: logo-entra 0.6s cubic-bezier(.2, 1.6, .4, 1) both, logo-pula 1.6s 0.6s ease-in-out infinite; }
      @keyframes logo-entra { from { transform: scale(0.3) rotate(-20deg); opacity: 0; } }
      @keyframes logo-pula { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-8px) rotate(2deg); } }
      #carregando h1 { margin: 0; font: 400 min(8vh, 56px) Bangers, "Arial Black", sans-serif; letter-spacing: 3px; color: #ffcb05;
        text-shadow: 0 5px 0 #b3261e, 3px 0 0 #b3261e, -3px 0 0 #b3261e, 0 -3px 0 #b3261e, 0 9px 0 rgba(0, 0, 0, 0.4); }
      #carregando .barra { position: relative; width: min(380px, 72vw); height: 22px; border-radius: 12px; background: #0b0c22; border: 3px solid #121218; box-shadow: 0 0 0 3px #fff, 0 6px 0 3px rgba(0, 0, 0, 0.35); overflow: hidden; }

        background-image: linear-gradient(180deg, rgba(255,255,255,0.25), transparent 50%), repeating-linear-gradient(-45deg, #e3350d 0 12px, #f0502c 12px 24px); background-size: auto, 34px 100%; animation: listras 0.6s linear infinite; }

  <body>
    <div id="game"></div>
    <div id="ui"></div>
    <div id="carregando">
      <div class="logo" role="img" aria-label="Arena Pokémon"></div>
      <h1>ARENA POKÉMON</h1>
      <div class="barra"><i></i><b>0%</b></div>
      <div class="dica"></div>
      <div class="legal">Projeto de fã sem fins lucrativos · Pokémon pertence à Nintendo, Game Freak e Creatures · Criado por Francisco Audir (@filho.af)</div>
    </div>
    <script>
      // dicas do carregamento (trocam a cada 2,6 s; o main.ts tira a tela quando o jogo fica pronto)
      (function () {
        var d = [
          '<strong>Dica:</strong> arraste o botão do golpe para mirar e solte para atacar.',
          '<strong>Dica:</strong> um toque rápido no botão ataca o rival mais perto.',
          '<strong>Dica:</strong> fogo vence planta, água vence fogo, planta vence água.',
          '<strong>Dica:</strong> golpes iguais batendo de frente viram um cabo de guerra: aperte rápido!',
          '<strong>Dica:</strong> Voo e Cavar desviam de quase tudo, mas não ficam para sempre.',
          '<strong>Dica:</strong> trocar de Pokémon salva quem está com pouca vida.',
          '<strong>Dica:</strong> na Sala de Testes você treina todos os golpes sem perder.',
        ];
        var el = document.querySelector('#carregando .dica'), i = Math.floor(Math.random() * d.length);
        function mostra() { if (!el || !el.isConnected) return; el.style.opacity = '0'; setTimeout(function () { el.innerHTML = d[i++ % d.length]; el.style.opacity = '1'; }, 300); }
        mostra(); var t = setInterval(function () { if (!el.isConnected) clearInterval(t); else mostra(); }, 2600);
      })();
    </script>
